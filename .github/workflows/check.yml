name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: smoke (sh)
        run: sh scripts/herdr-teacher teacher-env | grep "exported to the engine:"
      - name: smoke (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\herdr-teacher.cmd teacher-env
